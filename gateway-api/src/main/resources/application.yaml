spring:
  application:
    name: gateway-api

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: monster-service
              uri: lb://MONSTER-SERVICE
              predicates:
                - Path=api/monsters/**,/categories/**
              filters:
                - StripPrefix=1

            - id: region-service
              uri: lb://REGION-SERVICE
              predicates:
                - Path=api/regions/**,/sightings/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway